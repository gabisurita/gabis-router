name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace with Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint WASM crate with Clippy
        run: cargo clippy -p rsrouter-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Check Python tool scripts syntax
        run: python3 -m py_compile tools/*.py

      - name: Read wasm-bindgen version
        id: wbg
        run: echo "version=$(cargo pkgid wasm-bindgen | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli
        id: wbg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ steps.wbg.outputs.version }}

      - name: Install wasm-bindgen-cli
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install -f wasm-bindgen-cli --version "${{ steps.wbg.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Compute weekly cache key for routing segment
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache W5_N50.rd5 routing segment
        id: rd5-cache
        uses: actions/cache@v4
        with:
          path: data/segments4/W5_N50.rd5
          key: rd5-w5-n50-${{ steps.week.outputs.key }}

      - name: Download W5_N50.rd5 routing segment
        if: steps.rd5-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/segments4
          curl -fSL --retry 3 -o data/segments4/W5_N50.rd5 https://tiles.surita.dev/segments4/W5_N50.rd5 \
            || curl -fSL --retry 3 -o data/segments4/W5_N50.rd5 https://brouter.de/brouter/segments4/W5_N50.rd5

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Build WASM bindings
        run: npm --prefix web run build:wasm

      - name: Run web tests
        run: npm --prefix web test

      - name: Build web bundle
        env:
          VITE_SEGMENTS_BASE_URL: https://tiles.surita.dev/segments4
          VITE_MAP_TILES_BASE_URL: https://tiles.surita.dev/map-tiles
          VITE_PUBLIC_WEB_URL: https://router.surita.dev
          VITE_THUNDERFOREST_KEY: ${{ secrets.VITE_THUNDERFOREST_KEY || vars.VITE_THUNDERFOREST_KEY }}
        run: npm --prefix web run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
