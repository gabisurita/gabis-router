syntax = "proto3";
package pronto.entities;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";

message Device {
  optional string id = 1 [json_name = "id"];
  optional string theme = 2 [json_name = "theme"];
  optional string units = 3 [json_name = "units"];
}

message OfflineBundle {
  optional string id = 1 [json_name = "id"];
  optional string title = 2 [json_name = "title"];
  optional string coverage = 3 [json_name = "coverage"];
  optional string size_label = 4 [json_name = "size_label"];
  optional string status = 5 [json_name = "status"];
  optional int32 segments_cached = 6 [json_name = "segments_cached"];
  optional string pmtiles_ready = 7 [json_name = "pmtiles_ready"];
}

message PlaceAnswer {
  optional string id = 1 [json_name = "id"];
  optional string kind = 2 [json_name = "kind"];
  optional string q = 3 [json_name = "q"];
  optional string lang = 4 [json_name = "lang"];
  optional string p0 = 5 [json_name = "p0"];
  optional string p1 = 6 [json_name = "p1"];
  optional string p2 = 7 [json_name = "p2"];
  optional string p3 = 8 [json_name = "p3"];
  optional string p4 = 9 [json_name = "p4"];
}

message PlaceSuggestion {
  optional string id = 1 [json_name = "id"];
  optional string q = 2 [json_name = "q"];
  optional string label = 3 [json_name = "label"];
  optional string line1 = 4 [json_name = "line1"];
  optional string district = 5 [json_name = "district"];
  optional string city = 6 [json_name = "city"];
  optional string region = 7 [json_name = "region"];
  optional string postal_code = 8 [json_name = "postal_code"];
  optional string country = 9 [json_name = "country"];
  optional string latitude = 10 [json_name = "latitude"];
  optional string longitude = 11 [json_name = "longitude"];
}

message PlannerState {
  optional string id = 1 [json_name = "id"];
  optional string drawer = 2 [json_name = "drawer"];
  optional string modal = 3 [json_name = "modal"];
  optional string breakdown_tab = 4 [json_name = "breakdown_tab"];
  optional string basemap = 5 [json_name = "basemap"];
  optional string terrain_3d = 6 [json_name = "terrain_3d"];
  optional string legend_open = 7 [json_name = "legend_open"];
  optional string clear_confirm = 8 [json_name = "clear_confirm"];
  optional string share_status = 9 [json_name = "share_status"];
  optional string search_step = 10 [json_name = "search_step"];
  optional string search_text = 11 [json_name = "search_text"];
  optional string search_q = 12 [json_name = "search_q"];
  optional string waypoints_json = 13 [json_name = "waypoints_json"];
  optional int32 waypoint_count = 14 [json_name = "waypoint_count"];
  optional string avoids_json = 15 [json_name = "avoids_json"];
  optional int32 avoid_count = 16 [json_name = "avoid_count"];
  optional int32 avoid_radius_m = 17 [json_name = "avoid_radius_m"];
