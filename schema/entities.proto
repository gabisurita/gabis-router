  optional string inspect_summary = 30 [json_name = "inspect_summary"];
  optional string center_lat = 31 [json_name = "center_lat"];
  optional string center_lon = 32 [json_name = "center_lon"];
  optional string zoom = 33 [json_name = "zoom"];
  optional string start_label = 34 [json_name = "start_label"];
  optional string end_label = 35 [json_name = "end_label"];
  optional string active_distance_label = 36 [json_name = "active_distance_label"];
  optional string active_ascent_label = 37 [json_name = "active_ascent_label"];
  optional string active_descent_label = 38 [json_name = "active_descent_label"];
  optional string active_duration_label = 39 [json_name = "active_duration_label"];
  optional string active_energy_label = 40 [json_name = "active_energy_label"];
  optional int32 active_warnings_count = 41 [json_name = "active_warnings_count"];
  optional string active_elevation_json = 42 [json_name = "active_elevation_json"];
  optional string active_breakdown_json = 43 [json_name = "active_breakdown_json"];
  optional int32 offline_seq = 44 [json_name = "offline_seq"];
}

message RouteAnswer {
  optional string id = 1 [json_name = "id"];
  optional string request_key = 2 [json_name = "request_key"];
  optional string slot_0_json = 3 [json_name = "slot_0_json"];
  optional string slot_1_json = 4 [json_name = "slot_1_json"];
  optional string slot_2_json = 5 [json_name = "slot_2_json"];
