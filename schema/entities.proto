  optional string inspect_json = 8 [json_name = "inspect_json"];
  optional string matched_waypoints_json = 9 [json_name = "matched_waypoints_json"];
  optional string offline_json = 10 [json_name = "offline_json"];
}

message RouteSlot {
  optional string id = 1 [json_name = "id"];
  optional int32 slot_index = 2 [json_name = "slot_index"];
  optional string active = 3 [json_name = "active"];
  optional string profile = 4 [json_name = "profile"];
  optional string profile_label = 5 [json_name = "profile_label"];
  optional int32 alt = 6 [json_name = "alt"];
  optional string alt_label = 7 [json_name = "alt_label"];
  optional string status = 8 [json_name = "status"];
  optional int32 distance_m = 9 [json_name = "distance_m"];
  optional string distance_label = 10 [json_name = "distance_label"];
  optional int32 ascent_m = 11 [json_name = "ascent_m"];
  optional string ascent_label = 12 [json_name = "ascent_label"];
  optional int32 descent_m = 13 [json_name = "descent_m"];
  optional string descent_label = 14 [json_name = "descent_label"];
  optional int32 time_s = 15 [json_name = "time_s"];
  optional string duration_label = 16 [json_name = "duration_label"];
  optional int32 energy_kcal = 17 [json_name = "energy_kcal"];
  optional int32 warnings_count = 18 [json_name = "warnings_count"];
  optional string elevation_json = 19 [json_name = "elevation_json"];
  optional string breakdown_json = 20 [json_name = "breakdown_json"];
}
